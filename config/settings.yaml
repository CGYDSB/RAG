# ==============================
# RAG Project Configuration
# 本地 CPU 开发环境配置
# ==============================

# 1. 应用服务配置
app:
  name: "RAG System"
  version: "1.0.0"
  debug: true                   # 开发阶段开启，方便排查问题
  host: "0.0.0.0"
  port: 8000
  workers: 1                    # CPU 单机，1个worker即可

# 2. 大语言模型（LLM）配置
llm:
  provider: "openai"
  model: "deepseek-chat"        # 比 gpt-4 便宜，本地测试够用
  temperature: 0.1
  max_tokens: 1000
  top_p: 0.9
  api_key: ${OPENAI_API_KEY}    # 从 .env 读取
  base_url: "https://api.deepseek.com"
  timeout: 60
  max_retries: 3

# 3. 向量嵌入模型配置
embedding:
  provider: "sentence-transformers"
  model: "BAAI/bge-small-zh-v1.5"   # 专为中文优化，效果远好于multilingual
  batch_size: 32
  device: "cpu"
  normalize_embeddings: true
  cache_enabled: true
  local_model_path: null
  trust_remote_code: false

# 4. 向量数据库配置
vector_store:
  provider: "chroma"            # 本地文件存储，无需额外服务

  chroma:
    persist_directory: "./data/chroma_db"
    collection_name: "documents"
    distance_function: "cosine"

  qdrant:
    host: "localhost"
    port: 6333
    grpc_port: 6334
    api_key: null
    collection_name: "documents"
    vector_size: 512              # bge-small-zh-v1.5 维度

  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: null
    index_name: "rag_index"

# 5. 文档处理配置
document:
  supported_formats: [".pdf", ".txt", ".md", ".docx", ".html"]
  max_file_size: 50
  default_chunk_size: 256      # 调小，让每个chunk更聚焦
  default_chunk_overlap: 30

  pdf:
    extract_images: false
    ocr_enabled: false

  splitting:
    separators: ["\n\n", "\n", ". ", " ", ""]
    keep_separator: true
    is_separator_regex: true

# 6. 检索模块配置
retrieval:
  top_k: 5
  similarity_threshold: 0.5    # 适当降低阈值，本地测试文档少时更容易召回
  off_topic_threshold: 0.3     # 最高分低于此值时判定为无关问题，直接拒答

  hybrid_search:
    enabled: true
    vector_weight: 0.7
    keyword_weight: 0.3

  reranker:
    enabled: false              # CPU 上关闭，避免额外下载模型和性能开销

  query_expansion:
    enabled: false              # 关闭，减少 LLM API 调用次数和费用

# 7. RAG 主流程配置
pipeline:
  max_context_length: 3000
  context_window_strategy: "sliding"
  citation_enabled: true
  citation_format: "[[{index}]]"
  streaming_enabled: true
  cache_enabled: true
  cache_ttl: 3600
  # 多轮对话配置
  keep_recent_turns: 2          # 保留完整的最近N轮
  max_history_tokens: 1000      # 历史摘要最大token
  max_total_tokens: 7000        # 总token预算（8K窗口留1K余量）

# 8. 评估模块
evaluation:
  enabled: false                # 本地开发阶段关闭，需要时手动开启
  metrics:
    - "faithfulness"
    - "answer_relevancy"
    - "context_precision"
    - "context_recall"
  sample_size: 10

# 9. 日志系统
logging:
  level: "DEBUG"                # 开发阶段用 DEBUG，方便排查
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  file: "./logs/rag_system.log"
  rotation: "10 MB"
  retention: "30 days"

# 10. 安全配置
security:
  api_key_header: "X-API-Key"
  rate_limit: 100
  max_request_size: 10
  allowed_origins: ["*"]
