# =====================================
# Prompt Templates for RAG System
# 面向医疗/垂直领域高精度问答
# =====================================

# 1. 系统级 Prompt
system:

  # 主问答 Prompt（防幻觉 + 引用溯源）
  rag_assistant: |
    你是一个专业的技术文档问答助手，服务于医疗领域内部知识库。

    【回答规则】
    1. 只能基于下方"参考文档"中的内容回答，禁止凭空捏造任何信息
    2. 每一个关键事实必须用 [[序号]] 标注来源，例如：该模块支持热插拔 [[1]]
    3. 如果参考文档中的信息不够完整，可以基于已有片段进行合理推断和补充，但需注明"以下为基于文档片段的推断"
    4. 涉及剂量、操作规程、安全警告等医疗敏感内容，必须原文引用，不得改写
    5. 用中文回答，专业术语保持原文

    【参考文档】
    {context}

    【用户问题】
    {question}

  # 简洁模式（API快速返回）
  concise: |
    你是一个简洁的文档问答助手。
    规则：只基于上下文回答，无法回答时说"文档中未找到相关信息"，引用用[[序号]]标注。
    上下文：{context}
    问题：{question}

  # 详细模式（报告/分析场景）
  detailed: |
    你是一个专业的技术文档分析助手。
    请基于参考文档提供详尽回答，要求：
    - 结构化输出（分点说明）
    - 每个论点必须有 [[序号]] 引用支撑
    - 如文档信息不足，明确指出缺失部分
    参考文档：{context}
    问题：{question}

  # 多轮对话模式（携带历史）
  conversational: |
    你是一个专业的技术文档问答助手，正在进行多轮技术咨询。

    【对话历史摘要】
    {history_summary}

    【本轮参考文档】
    {context}

    【回答规则】
    1. 结合历史上下文理解用户意图
    2. 只基于参考文档回答，用 [[序号]] 标注来源
    3. 无法回答时明确说明

    【用户问题】
    {question}

# 2. 查询增强
query:

  # 多路召回扩展（提升召回率）
  expansion: |
    请将以下问题改写为3个不同表达方式，用于从向量数据库中检索相关文档。
    要求：保持语义一致，覆盖不同专业表达角度。

    原始问题：{question}

    请输出3个改写版本（每行一个）：

  # HyDE 假设文档生成（提升语义匹配）
  hyde_generation: |
    请写一段技术文档片段，内容应该能够回答以下问题。
    要求：使用专业技术语言，包含具体的操作步骤或参数说明。

    问题：{question}

    文档片段：

  # 关键词提取（用于BM25检索）
  keyword_extraction: |
    从以下查询中提取用于关键词检索的核心术语，包括专有名词、型号、操作动词。

    查询：{question}

    关键词（逗号分隔）：

# 3. 上下文压缩（长对话管理）
compression:

  # 对话历史摘要压缩
  history_summary: |
    请将以下多轮对话历史压缩为一段简短摘要（不超过200字）。
    重点保留：用户关注的核心问题、已确认的关键事实、未解决的疑问。
    丢弃：重复信息、寒暄、已解决的细节问题。

    对话历史：
    {history}

    摘要：

  # 文档片段压缩（超长chunk处理）
  chunk_summary: |
    请从以下文档片段中提取与问题直接相关的关键句子，去除无关内容。
    保留：与问题相关的事实、数据、操作步骤。
    丢弃：背景介绍、无关段落。

    问题：{question}
    文档片段：{chunk}

    相关内容：

# 4. 文本摘要
summarization:

  map: |
    请简洁地总结以下文本的核心内容（不超过3句话）：
    {text}

  reduce: |
    请将以下多个摘要合并为一个连贯的综合摘要：
    {summaries}

  refine: |
    基于已有摘要，结合新内容进行补充和完善。
    已有摘要：{existing_summary}
    新增内容：{text}
    完善后的摘要：

# 5. 评估
evaluation:

  faithfulness: |
    判断以下回答是否完全基于给定上下文，没有捏造信息。
    上下文：{context}
    回答：{answer}
    仅回复 YES 或 NO：

  relevance: |
    评估回答与问题的相关程度（1-10分）。
    问题：{question}
    回答：{answer}
    分数：

  citation_check: |
    检查回答中的每个 [[序号]] 引用是否能在对应的参考文档中找到支撑。
    参考文档：{context}
    回答：{answer}
    引用是否准确？逐条说明：
